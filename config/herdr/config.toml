# herdr config for the portable pitwall.
# Loaded via HERDR_CONFIG_PATH, set by Start-Pitwall.ps1.
# Your global %APPDATA%\herdr config is never read or written.
#
# Only keys verified against https://herdr.dev/docs/configuration/ are set here.
# To see everything available: herdr --default-config

# Skip herdr's first-run notification setup. The bundle already sets
# [ui.toast] below, so the wizard would only ask a question this config has
# already answered. Note that omitting this key is not the same as false:
# herdr's own default config says "Missing also shows onboarding".
onboarding = false

[terminal]
# Not "pwsh" directly. herdr rebuilds PATH for the panes it spawns, so this
# wrapper re-adds the bundle bin before starting PowerShell. Without it,
# delta, bat, glow and lazygit are invisible inside panes.
# __BUNDLE__ is substituted at launch, see platform/windows/Build-HerdrConfig.ps1
default_shell = "__BUNDLE__/platform/windows/agent-shell.cmd"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "rose-pine"

# Rose Pine Moon, approximated on top of the built-in rose-pine base.
#
# herdr ships rose-pine and rose-pine-dawn but not the moon variant, so the
# moon tones come from these overrides. Run `herdr config check` after editing:
# an unknown theme name is silently replaced by catppuccin.
#
# panel_bg = "reset" is the important one. It stops herdr painting an opaque
# background behind the panes, so Windows Terminal's acrylic shows through and
# you get the layered look instead of a flat rectangle.
#
# These also work around open issue herdrdev/herdr#2692, where sidebar labels
# render nearly invisible on dark themes.
[theme.custom]
panel_bg      = "reset"
sidebar_bg    = "#232136"
active_row_bg = "#2a273f"
selection_bg  = "#44415a"
accent        = "#c4a7e7"
red           = "#eb6f92"
green         = "#3e8fb0"

# Sidebar: agent state first, then where it is running.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

# Spaces carry the git context, which is the point of the right-hand panel.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui]
tab_bar_position = "bottom"

# The always-visible hint line, in the bottom bar next to the tabs.
#
# This is the answer to the single loudest complaint about the console: you
# are in the middle of something, you need a key, and there is nowhere on
# screen that tells you. herdr has no hint-bar feature, but tab_bar_right takes
# ordered status entries and one of the supported types is plain text, so the
# bar doubles as one.
#
# The key name is `text`, not `value`. `value` parses as an error, which
# `herdr config check` catches immediately.
#
# Keep this SHORT. It shares the bottom row with the tab labels, and a long
# string pushes them off. Three entries is about the limit; everything else
# lives one keypress away in ctrl+b i.
tab_bar_right = [{ type = "text", text = "F1 keys · ctrl+b f files · ctrl+b z zoom" }]

# Start with the agent sidebar as a rail, not a 26-column panel.
#
# This is what makes the right-hand diff readable, and the arithmetic is the
# whole reason. Maximized on a 1920 screen at 125% scaling the terminal is 171
# columns (measured, not computed). herdr's expanded sidebar takes 26 of them,
# leaving 144 for the work pane and the file viewer. The viewer splits 50/50
# and has a hard NARROW_SPLIT of 80 columns below which it stops showing the
# tree and the content side by side and shows only one of them. 144 / 2 = 72,
# which is under 80, so the default layout could never render a diff beside the
# tree no matter what else was closed.
#
# "compact" and not "hidden" on purpose: the collapsed rail still shows agent
# state, which is requirement one of this whole bundle. "hidden" would buy a
# few more columns and defeat the point.
#
# herdr's own note: this takes effect on the NEXT launch, not on reload.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"

# Notifications through the OS, because the whole point of being told is being
# told when you are NOT looking at this window. An in-app toast is invisible on
# the monitor you are actually reading, which made the feature pointless.
#
# This was "herdr" (in-app) to avoid stealing focus. Windows toasts do not steal
# focus: they go to the Action Center and the foreground window keeps the
# keyboard. The original worry did not apply.
#
# Allowed values are off, herdr, terminal, system. Confirmed by feeding the
# validator a bad value and reading what it listed.
[ui.toast]
delivery = "system"
delay_seconds = 1

[worktrees]
directory = "__BUNDLE__/../.worktrees"

[session]
resume_agents_on_restore = true

# ---------------------------------------------------------------------------
# The right-hand panel. This is the whole point of the setup.
# prefix is ctrl+b by default.
# ---------------------------------------------------------------------------

# Tree on the left, diff/markdown/code on the right, in a split.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-windows"
description = "file viewer (split)"

# Same thing, full tab.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab-windows"
description = "file viewer (tab)"

# Fallback panel: if the file viewer plugin misbehaves on Windows, this always
# works. See docs/PLAN.md, open issue herdrdev/herdr#3024.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "__BUNDLE__/bin/lazygit.exe"
description = "lazygit"
width = "90%"
height = "90%"

# The key card, over everything, in one keypress.
#
# Deliberately NOT bound to prefix+? even though that is the obvious key:
# prefix+? is herdr's own generated key list, which is better than anything
# written by hand and should stay reachable. This card covers what herdr's
# list cannot know about, the file viewer's keys and micro's, and points at
# prefix+? for the rest. prefix+i is free in herdr 0.8.2's default bindings.
#
# Through a wrapper, not `glow -p` directly. glow's pager shells out to `less`,
# which does not exist on Windows, so the popup opened, glow died instantly and
# the popup shut again: ctrl+b i looked like a dead key. See keycard.cmd.
[[keys.command]]
key = "prefix+i"
type = "popup"
command = "__BUNDLE__/platform/windows/keycard.cmd"
description = "key card"
width = "86%"
height = "90%"

# The same card on F1, with no prefix involved.
#
# Not a duplicate for the sake of it: the key card is the one thing you reach
# for when nothing else is working, and a rescue key that depends on the prefix
# you are trying to escape is not a rescue key.
#
# F1 specifically, and this was measured rather than guessed. The first attempt
# used ctrl+alt+k and did nothing at all, because herdr's own config warns that
# "alt+... may depend on your terminal", and that is the one family it calls
# unreliable. Its reliable list is ctrl+letter, function keys, and explicit
# modified chords.
#
# ctrl+letter is out. Claude Code runs in the pane next door and already binds
# ctrl+ c d e g j l n o p r s t v x and _, plus ctrl+x as a chord prefix. Any
# ctrl+letter this bundle claims is one Claude Code silently stops receiving,
# which is the conflict class to design against, not to discover later.
#
# Function keys are the only genuinely free surface: Claude Code binds none of
# F1 to F12, micro uses ctrl chords, the file viewer leaves F1 to F12 unbound,
# and Windows Terminal only takes F11 for fullscreen. F1 also means help
# everywhere else, which is exactly what this is.
[[keys.command]]
key = "f1"
type = "popup"
command = "__BUNDLE__/platform/windows/keycard.cmd"
description = "key card (no prefix)"
width = "86%"
height = "90%"
