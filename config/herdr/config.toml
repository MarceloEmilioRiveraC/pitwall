# herdr config for the portable pitwall.
# Loaded via HERDR_CONFIG_PATH, set by Start-Pitwall.ps1.
# Your global %APPDATA%\herdr config is never read or written.
#
# Only keys verified against https://herdr.dev/docs/configuration/ are set here.
# To see everything available: herdr --default-config

# Skip herdr's first-run notification setup. The bundle already sets
# [ui.toast] below, so the wizard would only ask a question this config has
# already answered. Note that omitting this key is not the same as false:
# herdr's own default config says "Missing also shows onboarding".
onboarding = false

[terminal]
# Not "pwsh" directly. herdr rebuilds PATH for the panes it spawns, so this
# wrapper re-adds the bundle bin before starting PowerShell. Without it,
# delta, bat, glow and lazygit are invisible inside panes.
# __BUNDLE__ is substituted at launch, see platform/windows/Build-HerdrConfig.ps1
default_shell = "__BUNDLE__/platform/windows/agent-shell.cmd"
shell_mode = "auto"
new_cwd = "follow"

[theme]
name = "rose-pine"

# Rose Pine Moon, approximated on top of the built-in rose-pine base.
#
# herdr ships rose-pine and rose-pine-dawn but not the moon variant, so the
# moon tones come from these overrides. Run `herdr config check` after editing:
# an unknown theme name is silently replaced by catppuccin.
#
# panel_bg = "reset" is the important one. It stops herdr painting an opaque
# background behind the panes, so Windows Terminal's acrylic shows through and
# you get the layered look instead of a flat rectangle.
#
# These also work around open issue herdrdev/herdr#2692, where sidebar labels
# render nearly invisible on dark themes.
[theme.custom]
panel_bg      = "reset"
sidebar_bg    = "#232136"
active_row_bg = "#2a273f"
selection_bg  = "#44415a"
accent        = "#c4a7e7"
red           = "#eb6f92"
green         = "#3e8fb0"

# Sidebar: agent state first, then where it is running.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

# Spaces carry the git context, which is the point of the right-hand panel.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui]
tab_bar_position = "bottom"

# Notifications in-app rather than through the OS, so a background agent
# finishing does not steal focus from whatever you are reading.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[worktrees]
directory = "__BUNDLE__/../.worktrees"

[session]
resume_agents_on_restore = true

# ---------------------------------------------------------------------------
# The right-hand panel. This is the whole point of the setup.
# prefix is ctrl+b by default.
# ---------------------------------------------------------------------------

# Tree on the left, diff/markdown/code on the right, in a split.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-windows"
description = "file viewer (split)"

# Same thing, full tab.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab-windows"
description = "file viewer (tab)"

# Fallback panel: if the file viewer plugin misbehaves on Windows, this always
# works. See docs/PLAN.md, open issue herdrdev/herdr#3024.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "__BUNDLE__/bin/lazygit.exe"
description = "lazygit"
width = "90%"
height = "90%"
