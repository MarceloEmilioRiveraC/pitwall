<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="pitwall, a portable Windows control room for AI coding agents. A pit wall of monitors watching a car go past.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232136"/>
      <stop offset="100%" stop-color="#1c1a2b"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eb6f92" stop-opacity="0"/>
      <stop offset="100%" stop-color="#eb6f92" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c4a7e7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>

  <!-- the pit wall: a stand carrying a row of screens, which is the whole idea -->
  <g transform="translate(70,52)">
    <rect x="-14" y="-14" width="404" height="132" rx="10" fill="url(#glow)"/>

    <!-- screen 1: a diff, red above green -->
    <g transform="translate(0,0)">
      <rect width="66" height="46" rx="4" fill="#2a273f" stroke="#44415a"/>
      <rect x="7"  y="10" width="42" height="5" rx="2" fill="#eb6f92"/>
      <rect x="7"  y="20" width="52" height="5" rx="2" fill="#3e8fb0"/>
      <rect x="7"  y="30" width="30" height="5" rx="2" fill="#3e8fb0"/>
    </g>
    <!-- screen 2: a file tree -->
    <g transform="translate(84,0)">
      <rect width="66" height="46" rx="4" fill="#2a273f" stroke="#44415a"/>
      <rect x="8"  y="10" width="26" height="4" rx="2" fill="#908caa"/>
      <rect x="14" y="19" width="34" height="4" rx="2" fill="#9ccfd8"/>
      <rect x="14" y="28" width="40" height="4" rx="2" fill="#908caa"/>
      <rect x="14" y="37" width="22" height="4" rx="2" fill="#f6c177"/>
    </g>
    <!-- screen 3: agent telemetry, one bar per agent -->
    <g transform="translate(168,0)">
      <rect width="66" height="46" rx="4" fill="#2a273f" stroke="#44415a"/>
      <rect x="9"  y="30" width="8" height="10" rx="2" fill="#3e8fb0"/>
      <rect x="21" y="22" width="8" height="18" rx="2" fill="#f6c177"/>
      <rect x="33" y="14" width="8" height="26" rx="2" fill="#c4a7e7"/>
      <rect x="45" y="26" width="8" height="14" rx="2" fill="#9ccfd8"/>
    </g>
    <!-- screen 4: the agent pane, a prompt -->
    <g transform="translate(252,0)">
      <rect width="66" height="46" rx="4" fill="#2a273f" stroke="#44415a"/>
      <text x="9" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c4a7e7">&#8250;</text>
      <rect x="22" y="19" width="34" height="6" rx="3" fill="#44415a"/>
    </g>
    <!-- screen 5: idle -->
    <g transform="translate(336,0)">
      <rect width="66" height="46" rx="4" fill="#2a273f" stroke="#44415a"/>
      <circle cx="33" cy="23" r="7" fill="none" stroke="#6e6a86" stroke-width="2"/>
    </g>

    <!-- the wall itself, and its legs -->
    <rect x="-6" y="54" width="414" height="9" rx="4" fill="#44415a"/>
    <rect x="18"  y="63" width="7" height="42" fill="#393552"/>
    <rect x="188" y="63" width="7" height="42" fill="#393552"/>
    <rect x="376" y="63" width="7" height="42" fill="#393552"/>
  </g>

  <!-- the track, and something going past it fast -->
  <g transform="translate(0,214)">
    <rect x="60" y="26" width="1080" height="2" fill="#393552"/>
    <rect x="60" y="34" width="1080" height="1" fill="#2a273f"/>

    <!-- speed lines -->
    <rect x="300" y="8"  width="120" height="3" rx="1.5" fill="url(#speed)"/>
    <rect x="270" y="17" width="150" height="3" rx="1.5" fill="url(#speed)"/>

    <!-- an open wheel car, kept to a silhouette on purpose -->
    <g transform="translate(430,0)">
      <rect x="-14" y="9" width="34" height="4"  rx="2" fill="#eb6f92"/>
      <path d="M20 18 L60 18 L96 12 L150 12 L162 18 L162 22 L20 22 Z" fill="#eb6f92"/>
      <path d="M96 12 L120 2 L138 2 L138 12 Z" fill="#ea9a97"/>
      <rect x="150" y="4" width="30" height="4" rx="2" fill="#eb6f92"/>
      <circle cx="44"  cy="24" r="10" fill="#232136" stroke="#908caa" stroke-width="3"/>
      <circle cx="140" cy="24" r="10" fill="#232136" stroke="#908caa" stroke-width="3"/>
    </g>
  </g>

  <!-- checkered strip -->
  <g transform="translate(60,266)">
    <g fill="#e0def4">
      <rect x="0"  y="0" width="9" height="9"/><rect x="18" y="0" width="9" height="9"/>
      <rect x="36" y="0" width="9" height="9"/><rect x="54" y="0" width="9" height="9"/>
      <rect x="9"  y="9" width="9" height="9"/><rect x="27" y="9" width="9" height="9"/>
      <rect x="45" y="9" width="9" height="9"/><rect x="63" y="9" width="9" height="9"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(560,96)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="72" font-weight="700" fill="#e0def4" letter-spacing="-2">pitwall</text>
    <text y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="21" fill="#c4a7e7">a portable control room for coding agents</text>
    <text y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="16" fill="#908caa">you watch the telemetry. they drive.</text>
  </g>
</svg>
